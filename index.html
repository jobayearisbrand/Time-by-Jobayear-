<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Nova Dynamic Watch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--white:#f5f5f5;--gray:#8d8d8d;--line:#242424;--card:#0d0d0d}
body{
 min-height:100vh;display:grid;place-items:center;overflow:hidden;
 font-family:Inter,Arial,sans-serif;color:var(--white);background:#020202;
}
body:before,body:after{
 content:"";position:fixed;border-radius:50%;filter:blur(90px);
 opacity:.18;pointer-events:none;animation:float 12s ease-in-out infinite alternate;
}
body:before{width:420px;height:420px;background:#fff;left:-180px;top:-160px}
body:after{width:350px;height:350px;background:#777;right:-150px;bottom:-150px;animation-delay:-4s}
@keyframes float{to{transform:translate(80px,50px) scale(1.15)}}

.watch{
 width:min(92vw,760px);padding:32px;border:1px solid #303030;border-radius:30px;
 background:linear-gradient(145deg,#151515,#080808);
 box-shadow:0 30px 90px #000,inset 0 1px 0 #3a3a3a;
 position:relative;overflow:hidden;
}
.watch:after{
 content:"";position:absolute;inset:-100%;background:linear-gradient(115deg,transparent 45%,#ffffff08 50%,transparent 55%);
 animation:scan 8s linear infinite;pointer-events:none
}
@keyframes scan{to{transform:translate(50%,50%)}}
.header,.info,.link-title{position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.brand{font-size:12px;letter-spacing:4px;font-weight:800;color:#aaa}
.live{font-size:10px;letter-spacing:2px;color:#aaa;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;background:#eee;border-radius:50%;box-shadow:0 0 12px #fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}

.clock{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;position:relative;z-index:1}
.unit{text-align:center;min-width:0}
.num{
 font-size:clamp(4rem,11vw,7.6rem);font-weight:900;line-height:.9;
 letter-spacing:-6px;font-variant-numeric:tabular-nums;
 text-shadow:0 0 25px #fff1;transition:.15s;
}
.num.tick{transform:translateY(-3px);text-shadow:0 0 28px #fff5}
.label{margin-top:17px;font-size:10px;letter-spacing:3px;color:#777;font-weight:800}
.colon{font-size:clamp(3rem,7vw,5.5rem);font-weight:300;color:#555;transform:translateY(-9px)}

.info{
 margin-top:35px;padding-top:22px;border-top:1px solid var(--line);
 display:flex;justify-content:space-between;gap:15px;align-items:center
}
.date{font-size:14px;font-weight:700;letter-spacing:1px;color:#cfcfcf}
.mode{font-size:11px;letter-spacing:3px;font-weight:800;color:#777}

.link-title{margin-top:27px;font-size:10px;letter-spacing:3px;color:#666;font-weight:800}
.link-box{
 position:relative;z-index:1;margin-top:9px;padding:14px 16px;border:1px solid #292929;
 border-radius:12px;background:#080808;display:flex;align-items:center;gap:12px;
 transition:.25s;cursor:pointer
}
.link-box:hover{border-color:#555;background:#101010;box-shadow:0 0 25px #fff08}
.link-box span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#aaa;flex:1}
.copy{font-size:10px;letter-spacing:1px;color:#eee;border:1px solid #333;padding:7px 9px;border-radius:7px}
.hint{text-align:center;margin-top:20px;color:#4e4e4e;font-size:9px;letter-spacing:2px;position:relative;z-index:1}

@media(max-width:520px){
 .watch{padding:23px 15px;border-radius:23px}
 .clock{gap:5px}.num{letter-spacing:-4px}
 .info{align-items:flex-start;flex-direction:column}
 .link-box{padding:12px}.copy{display:none}
}
</style>
</head>
<body>
<main class="watch">
 <div class="header">
  <div class="brand">JOBAYEAR IS BRAND</div>
  <div class="live"><i class="dot"></i>LIVE</div>
 </div>

 <section class="clock" aria-label="Digital time">
  <div class="unit"><div class="num" id="hour">00</div><div class="label">HOUR</div></div>
  <div class="colon">:</div>
  <div class="unit"><div class="num" id="minute">00</div><div class="label">MINUTE</div></div>
  <div class="colon">:</div>
  <div class="unit"><div class="num" id="second">00</div><div class="label">SECOND</div></div>
 </section>

 <div class="info">
  <div class="date" id="date">00-00-0000</div>
  <div class="mode" id="mode">DAY</div>
 </div>

 <div class="link-title">NOVA DYNAMIC</div>
 <a class="link-box" id="linkBox" href="https://jobayearisbrand.github.io/Nova-Dynamic" target="_blank" rel="noopener noreferrer" title="Open Nova Dynamic">
   <span>NOVA DYNAMIC</span>
   <b class="copy">OPEN</b>
 </a>
 <div class="hint">LOCAL TIME • AUTO UPDATE EVERY SECOND</div>
</main>

<script>
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function update(){
 const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
 const vals={hour:pad(h),minute:pad(m),second:pad(s)};
 Object.entries(vals).forEach(([id,v])=>{
   const el=$(id);
   if(el.textContent!==v){el.textContent=v;el.classList.add('tick');setTimeout(()=>el.classList.remove('tick'),170)}
 });
 $('date').textContent=`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
 $('mode').textContent=(h>=6&&h<18)?'DAY':'NIGHT';
}

update();setInterval(update,1000);
</script>
</body>
</html>
